name: Gold Signal

on:
  schedule:
  - cron: "2,17,32,47 * * * 0-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Test message bhejna hai? (1 likhein)"
        required: false
        default: ""

jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ github.event.inputs.test }}
        run: python gold_signal.py
